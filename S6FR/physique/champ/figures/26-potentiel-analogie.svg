<path d="M340.0 18.0 L340.0 252.0" fill="none" stroke="#9aa1ab" class="s-soft" stroke-width="1.00" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><ellipse cx="175.0" cy="128.0" rx="34.0" ry="20.0" fill="none" stroke="#9aa1ab" class="s-soft" stroke-width="1.10" stroke-dasharray="5 5"/><text x="149.0" y="110.9" text-anchor="middle" font-size="10.0" fill="#9aa1ab" class="f-soft">300 m</text><ellipse cx="175.0" cy="128.0" rx="62.0" ry="37.0" fill="none" stroke="#9aa1ab" class="s-soft" stroke-width="1.10" stroke-dasharray="5 5"/><text x="129.2" y="98.8" text-anchor="middle" font-size="10.0" fill="#9aa1ab" class="f-soft">200 m</text><ellipse cx="175.0" cy="128.0" rx="92.0" ry="55.0" fill="none" stroke="#9aa1ab" class="s-soft" stroke-width="1.10" stroke-dasharray="5 5"/><text x="108.0" y="86.1" text-anchor="middle" font-size="10.0" fill="#9aa1ab" class="f-soft">100 m</text><ellipse cx="175.0" cy="128.0" rx="122.0" ry="73.0" fill="none" stroke="#9aa1ab" class="s-soft" stroke-width="1.10" stroke-dasharray="5 5"/><text x="86.7" y="73.4" text-anchor="middle" font-size="10.0" fill="#9aa1ab" class="f-soft">0 m</text><text x="175.0" y="132.0" text-anchor="middle" font-size="11.0" fill="#55606e" class="f-mut">sommet</text><circle cx="240.0" cy="167.0" r="5.0" fill="#1d1d20" class="f-ink"/><path d="M246.0 171.0 L278.7 190.6" fill="none" stroke="#0a7f52" class="s-acc" stroke-width="2.10" stroke-linecap="round" stroke-linejoin="round"/><polygon points="286.0,195.0 276.9,193.7 280.5,187.6" fill="#0a7f52" class="f-acc"/><text x="303.0" y="210.0" text-anchor="middle" font-size="11.5" fill="#0a7f52" class="f-acc">la bille descend</text><text x="175.0" y="246.0" text-anchor="middle" font-size="12.5" fill="#1d1d20" class="f-ink">courbes de niveau : même altitude</text><text x="175.0" y="267.0" text-anchor="middle" font-size="11.5" fill="#55606e" class="f-mut">la pente est perpendiculaire aux courbes</text><path d="M420.0 62.0 L420.0 196.0" fill="none" stroke="#c0392b" class="s-pos" stroke-width="3.40" stroke-linecap="round" stroke-linejoin="round"/><path d="M620.0 62.0 L620.0 196.0" fill="none" stroke="#1d4ed8" class="s-neg" stroke-width="3.40" stroke-linecap="round" stroke-linejoin="round"/><text x="408.0" y="52.0" text-anchor="middle" font-size="13.0" fill="#c0392b" class="f-pos">&#8853;</text><text x="632.0" y="52.0" text-anchor="middle" font-size="13.0" fill="#1d4ed8" class="f-neg">&#8854;</text><path d="M470.0 66.0 L470.0 192.0" fill="none" stroke="#9aa1ab" class="s-soft" stroke-width="1.10" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="470.0" y="214.0" text-anchor="middle" font-size="12.0" fill="#9aa1ab" class="f-soft"><tspan class='it'>V</tspan><tspan font-size='9'>1</tspan></text><path d="M520.0 66.0 L520.0 192.0" fill="none" stroke="#9aa1ab" class="s-soft" stroke-width="1.10" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="520.0" y="214.0" text-anchor="middle" font-size="12.0" fill="#9aa1ab" class="f-soft"><tspan class='it'>V</tspan><tspan font-size='9'>2</tspan></text><path d="M570.0 66.0 L570.0 192.0" fill="none" stroke="#9aa1ab" class="s-soft" stroke-width="1.10" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="570.0" y="214.0" text-anchor="middle" font-size="12.0" fill="#9aa1ab" class="f-soft"><tspan class='it'>V</tspan><tspan font-size='9'>3</tspan></text><path d="M426.0 92.0 L606.5 92.0" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.40" stroke-linecap="round" stroke-linejoin="round"/><polygon points="614.0,92.0 606.5,95.2 606.5,88.8" fill="#55606e" class="f-mut"/><path d="M426.0 129.0 L606.5 129.0" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.40" stroke-linecap="round" stroke-linejoin="round"/><polygon points="614.0,129.0 606.5,132.2 606.5,125.8" fill="#55606e" class="f-mut"/><path d="M426.0 166.0 L606.5 166.0" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.40" stroke-linecap="round" stroke-linejoin="round"/><polygon points="614.0,166.0 606.5,169.2 606.5,162.8" fill="#55606e" class="f-mut"/><text x="534.0" y="84.0" text-anchor="start" font-size="14.0" fill="#55606e" class="it f-mut">E</text><path d="M534.0 71.1 L543.0 71.1" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.20" stroke-linecap="round" stroke-linejoin="round"/><path d="M540.0 68.4 L543.0 71.1" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.20" stroke-linecap="round" stroke-linejoin="round"/><path d="M543.0 71.1 L540.0 73.8" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.20" stroke-linecap="round" stroke-linejoin="round"/><text x="520.0" y="246.0" text-anchor="middle" font-size="12.5" fill="#1d1d20" class="f-ink">équipotentielles : même potentiel</text><text x="520.0" y="267.0" text-anchor="middle" font-size="11.5" fill="#55606e" class="f-mut">le champ leur est perpendiculaire, et <tspan class='it'>V</tspan><tspan font-size='9'>1</tspan> &gt; <tspan class='it'>V</tspan><tspan font-size='9'>2</tspan> &gt; <tspan class='it'>V</tspan><tspan font-size='9'>3</tspan></text><text x="340.0" y="300.0" text-anchor="middle" font-size="12.0" fill="#55606e" class="f-mut">le potentiel électrique joue le rôle de l'altitude ; le champ, celui de la pente</text>
</svg>
