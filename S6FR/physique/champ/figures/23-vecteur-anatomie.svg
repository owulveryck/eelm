<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="Les quatre caractéristiques d'un vecteur">
<title>Les quatre caractéristiques d'un vecteur</title>
<style>
text{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.it{font-family:ui-serif,Georgia,"Times New Roman",serif;font-style:italic}
@media (prefers-color-scheme:dark){.s-ink{stroke:#e8e8ea}.f-ink{fill:#e8e8ea}.s-mut{stroke:#a3abb6}.f-mut{fill:#a3abb6}.s-pos{stroke:#ff8a7a}.f-pos{fill:#ff8a7a}.s-neg{stroke:#7fb3ff}.f-neg{fill:#7fb3ff}.s-acc{stroke:#4fc08d}.f-acc{fill:#4fc08d}.s-soft{stroke:#6b7280}.f-soft{fill:#6b7280}}
</style>
<path d="M62.0 168.0 L440.0 28.0" fill="none" stroke="#9aa1ab" class="s-soft" stroke-width="1.00" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M150.0 135.0 L320.6 71.5" fill="none" stroke="#1d1d20" class="s-ink" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"/><polygon points="330.0,68.0 322.1,75.4 319.2,67.6" fill="#1d1d20" class="f-ink"/><circle cx="150.0" cy="135.0" r="4.2" fill="#1d1d20" class="f-ink"/><text x="258.0" y="52.0" text-anchor="start" font-size="17.0" fill="#1d1d20" class="it f-ink">F</text><path d="M258.0 36.4 L267.0 36.4" fill="none" stroke="#1d1d20" class="s-ink" stroke-width="1.20" stroke-linecap="round" stroke-linejoin="round"/><path d="M264.0 33.7 L267.0 36.4" fill="none" stroke="#1d1d20" class="s-ink" stroke-width="1.20" stroke-linecap="round" stroke-linejoin="round"/><path d="M267.0 36.4 L264.0 39.1" fill="none" stroke="#1d1d20" class="s-ink" stroke-width="1.20" stroke-linecap="round" stroke-linejoin="round"/><circle cx="428.0" cy="48.0" r="10.0" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.20"/><text x="428.0" y="52.0" text-anchor="middle" font-size="11.0" fill="#55606e" class="f-mut">1</text><circle cx="348.0" cy="44.0" r="10.0" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.20"/><text x="348.0" y="48.0" text-anchor="middle" font-size="11.0" fill="#55606e" class="f-mut">2</text><circle cx="226.0" cy="124.0" r="10.0" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.20"/><text x="226.0" y="128.0" text-anchor="middle" font-size="11.0" fill="#55606e" class="f-mut">3</text><circle cx="134.0" cy="160.0" r="10.0" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.20"/><text x="134.0" y="164.0" text-anchor="middle" font-size="11.0" fill="#55606e" class="f-mut">4</text><path d="M224.0 112.0 L234.0 98.0" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.00" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M141.0 151.0 L148.0 142.0" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.00" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="30.0" cy="204.0" r="9.0" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.10"/><text x="30.0" y="208.0" text-anchor="middle" font-size="10.5" fill="#55606e" class="f-mut">1</text><text x="46.0" y="208.0" text-anchor="start" font-size="12.0" fill="#1d1d20" class="f-ink">la <tspan class='it'>direction</tspan> : l'inclinaison de la droite support (en pointillés)</text><circle cx="30.0" cy="228.0" r="9.0" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.10"/><text x="30.0" y="232.0" text-anchor="middle" font-size="10.5" fill="#55606e" class="f-mut">2</text><text x="46.0" y="232.0" text-anchor="start" font-size="12.0" fill="#1d1d20" class="f-ink">le <tspan class='it'>sens</tspan> : de quel côté on va sur cette droite (où pointe la flèche)</text><circle cx="30.0" cy="252.0" r="9.0" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.10"/><text x="30.0" y="256.0" text-anchor="middle" font-size="10.5" fill="#55606e" class="f-mut">3</text><text x="46.0" y="256.0" text-anchor="start" font-size="12.0" fill="#1d1d20" class="f-ink">la <tspan class='it'>norme</tspan> (ou valeur) : la longueur de la flèche, avec son unité</text><circle cx="30.0" cy="276.0" r="9.0" fill="none" stroke="#55606e" class="s-mut" stroke-width="1.10"/><text x="30.0" y="280.0" text-anchor="middle" font-size="10.5" fill="#55606e" class="f-mut">4</text><text x="46.0" y="280.0" text-anchor="start" font-size="12.0" fill="#1d1d20" class="f-ink">le <tspan class='it'>point d'application</tspan> : l'endroit où la grandeur agit</text>
</svg>
