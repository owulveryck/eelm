" class="s-soft" stroke-width="1.20"/><text x="278.0" y="155.0" text-anchor="middle" font-size="12.0" fill="#c0392b" class="f-pos">&#8853;</text><text x="302.0" y="155.0" text-anchor="middle" font-size="12.0" fill="#1d4ed8" class="f-neg">&#8854;</text><ellipse cx="350.0" cy="150.0" rx="24.0" ry="17.0" fill="none" stroke="#9aa1ab" class="s-soft" stroke-width="1.20"/><text x="338.0" y="155.0" text-anchor="middle" font-size="12.0" fill="#c0392b" class="f-pos">&#8853;</text><text x="362.0" y="155.0" text-anchor="middle" font-size="12.0" fill="#1d4ed8" class="f-neg">&#8854;</text><ellipse cx="410.0" cy="150.0" rx="24.0" ry="17.0" fill="none" stroke="#9aa1ab" class="s-soft" stroke-width="1.20"/><text x="398.0" y="155.0" text-anchor="middle" font-size="12.0" fill="#c0392b" class="f-pos">&#8853;</text><text x="422.0" y="155.0" text-anchor="middle" font-size="12.0" fill="#1d4ed8" class="f-neg">&#8854;</text><path d="M246.0 125.0 L160.0 125.0" fill="none" stroke="#c0392b" class="s-pos" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150.0,125.0 160.0,120.8 160.0,129.2" fill="#c0392b" class="f-pos"/><text x="198.0" y="112.0" text-anchor="middle" font-size="11.0" fill="#c0392b" class="f-pos">attraction forte</text><path d="M458.0 125.0 L512.0 125.0" fill="none" stroke="#1d4ed8" class="s-neg" stroke-width="1.50" stroke-linecap="round" stroke-linejoin="round"/><polygon points="520.0,125.0 512.0,128.4 512.0,121.6" fill="#1d4ed8" class="f-neg"/><text x="500.0" y="112.0" text-anchor="middle" font-size="11.0" fill="#1d4ed8" class="f-neg">r&#233;pulsion faible</text><text x="320.0" y="212.0" text-anchor="middle" font-size="12.0" fill="#1d1d20" class="f-ink">dans chaque atome, les charges se d&#233;placent un peu : les &#8853; se tournent vers la r&#232;gle</text><text x="320.0" y="234.0" text-anchor="middle" font-size="12.0" fill="#55606e" class="f-mut">ils sont plus pr&#232;s, donc plus attir&#233;s (loi en 1/<tspan class='it'>r</tspan>&#178;) : au total, le papier est attir&#233;</text>
