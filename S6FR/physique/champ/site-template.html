<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champ électrique — Physique S6</title>
<!--KATEXCSS-->
<style>
:root{
  --orange:#ee7d23; --orange-soft:#fbb040; --red:#e03c31; --yellow:#fff8c9;
  --ink:#1d1d20; --mut:#55606e; --soft:#9aa1ab;
  --cream:#fbf7ef; --line:#e9e1d2; --blue:#1d4ed8; --green:#0a7f52;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#efe9dd;color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.62;
     -webkit-text-size-adjust:100%}
/* ---------- barre du haut ---------- */
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
     background:#fff;border-bottom:3px solid var(--orange);padding:10px 18px}
#top .mark{width:0;height:0;border-left:13px solid var(--orange);border-top:8px solid transparent;
           border-bottom:8px solid transparent;flex:none}
#top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
#top .sub{color:var(--mut);font-size:13px;font-family:var(--sans)}
#burger{margin-left:auto;display:none;font-size:22px;background:none;border:1px solid var(--line);
        border-radius:7px;padding:2px 10px;cursor:pointer}
/* ---------- mise en page ---------- */
#wrap{display:flex;align-items:flex-start}
#side{width:290px;flex:none;background:var(--cream);border-right:1px solid var(--line);
      position:sticky;top:51px;height:calc(100vh - 51px);overflow:auto;padding:16px 0 60px}
#side input{width:calc(100% - 32px);margin:0 16px 14px;padding:7px 10px;border:1px solid var(--line);
            border-radius:8px;font-family:var(--sans);font-size:13px;background:#fff}
.navgroup h3{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
             color:var(--orange);margin:16px 16px 6px;font-weight:700}
.navgroup ul{list-style:none;margin:0;padding:0}
.navgroup a{display:block;padding:5px 16px 5px 20px;color:var(--ink);text-decoration:none;
            font-family:var(--sans);font-size:13.5px;line-height:1.35;border-left:3px solid transparent}
.navgroup a:hover{background:#f3ebdc}
.navgroup a.on{background:#fff;border-left-color:var(--orange);font-weight:600}
main{flex:1;min-width:0;background:#fff;min-height:calc(100vh - 51px);
     padding:30px clamp(18px,4vw,60px) 40px;box-shadow:0 0 18px rgba(0,0,0,.05)}
.inner{max-width:860px;margin:0 auto}
/* ---------- contenu ---------- */
.pane{display:none}
.pane.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:27px;line-height:1.25;margin:4px 0 20px;position:relative;padding-left:26px}
h2::before{content:"";position:absolute;left:0;top:.42em;width:0;height:0;
           border-left:14px solid var(--orange);border-top:9px solid transparent;border-bottom:9px solid transparent}
h3{font-size:19px;margin:30px 0 8px;color:#111}
h4{font-size:16.5px;margin:22px 0 6px;color:var(--mut);font-family:var(--sans)}
p{margin:.7em 0}
a{color:#b4540e}
strong{font-weight:700}
ul,ol{padding-left:22px}
li{margin:.3em 0}
li::marker{color:var(--orange)}
hr{border:none;border-top:1px solid var(--line);margin:28px 0}
/* formules : la boite jaune du livre (rendu KaTeX) */
.katex-display{margin:20px 0;overflow-x:auto;overflow-y:hidden;padding:3px 0}
.katex-display>.katex{display:inline-block;background:var(--yellow);border:2px solid var(--red);
  border-radius:5px;padding:11px 20px}
blockquote .katex-display>.katex,td .katex-display>.katex,li .katex-display>.katex{
  background:none;border:none;padding:0}
blockquote .katex-display{margin:12px 0}
.katex{font-size:1.1em}
/* repli si la compilation s'est faite sans KaTeX */
math[display="block"]{display:block;width:max-content;max-width:100%;margin:18px auto;padding:12px 20px;
  background:var(--yellow);border:2px solid var(--red);border-radius:5px;overflow-x:auto}
blockquote math[display="block"],td math[display="block"]{background:none;border:none;padding:4px 0}
/* citations / encadres */
blockquote{margin:20px 0;padding:14px 18px;background:var(--cream);border-left:4px solid var(--soft);
           border-radius:0 8px 8px 0}
blockquote p:first-child{margin-top:0} blockquote p:last-child{margin-bottom:0}
blockquote.enclair{background:#eef5ff;border-left-color:var(--blue)}
blockquote.retenir{background:#fff6e5;border-left-color:var(--orange)}
blockquote.exemple{background:#eefaf3;border-left-color:var(--green)}
blockquote.note{background:#f7f3ea;border-left-color:var(--soft)}
blockquote.tldr{margin:0 0 22px;background:#eef2f6;border-left-color:#5c7d99;color:#30414f}
blockquote.tldr strong:first-child{display:block;margin-bottom:4px;color:#5c7d99;
  font-size:12px;letter-spacing:.12em;text-transform:uppercase}
blockquote.pourexos{margin:30px 0 4px;background:#fff6e5;border:2px solid var(--orange);
  border-left-width:5px;border-radius:3px;padding:16px 20px}
blockquote.pourexos strong:first-child{display:block;margin-bottom:6px;color:#c25c00;
  font-size:13px;letter-spacing:.06em;text-transform:uppercase}
blockquote.pourexos ul{margin:8px 0 0;padding-left:22px} blockquote.pourexos li{margin:5px 0}
/* figures */
figure{margin:24px 0;text-align:center}
figure svg,.figsvg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.bordered svg{border:1px solid var(--line);border-radius:6px;background:#fff;padding:6px}
figcaption{font-size:13.5px;color:var(--mut);font-style:italic;margin-top:8px;text-align:center;
           max-width:620px;margin-left:auto;margin-right:auto}
svg text{font-family:var(--sans);font-size:13px}
svg .it{font-family:ui-serif,Georgia,"Times New Roman",serif;font-style:italic}
.solfig{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:14px 10px 6px;margin:0 0 26px}
/* tableaux */
table{border-collapse:collapse;margin:20px auto;font-size:15.5px;width:100%}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top}
thead th{background:#fdf0e2;font-family:var(--sans);font-size:13.5px}
tbody tr:nth-child(even){background:#fcfaf6}
/* boutons */
.btn{display:inline-block;font-family:var(--sans);font-size:14px;font-weight:600;text-decoration:none;
     background:var(--orange);color:#fff;padding:9px 18px;border-radius:999px;border:2px solid var(--orange)}
.btn:hover{background:#d96c15;border-color:#d96c15}
.btn.ghost{background:#fff;color:#b4540e}
.btn.ghost:hover{background:#fdf0e2}
.solbtn{margin-top:28px}
/* pied de page : navigation */
#foot{max-width:860px;margin:36px auto 0;display:flex;align-items:center;gap:12px;
      border-top:1px solid var(--line);padding-top:16px}
#foot button{font-family:var(--sans);font-size:14px;background:#fff;border:2px solid var(--line);
             border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--ink)}
#foot button:hover{border-color:var(--orange)}
#tab{margin-left:auto;background:var(--orange-soft);color:#5a3300;font-family:var(--sans);font-size:13px;
     font-weight:700;padding:6px 16px;border-radius:6px 6px 0 0}
/* responsive */
@media (max-width:900px){
  #burger{display:block}
  #side{position:fixed;left:0;top:51px;z-index:25;transform:translateX(-100%);transition:transform .2s;
        box-shadow:4px 0 20px rgba(0,0,0,.15)}
  #side.open{transform:none}
  main{padding:22px 16px 30px}
  h2{font-size:23px}
  body{font-size:16px}
}
#legal{margin:34px 0 0;padding-top:14px;border-top:1px solid #e6ded0;font-size:12px;
  color:#8a8077;line-height:1.7}
#legal a{color:#8a8077}
@media print{
  #side,#top,#foot,.solbtn{display:none}
  #legal{display:block}
  .pane{display:block!important;page-break-after:always}
  main{box-shadow:none}
}
</style>
</head>
<body>
<header id="top">
  <span class="mark"></span>
  <h1>Champ électrique</h1>
  <span class="sub">Physique S6 · École européenne Jacques Delors</span>
  <button id="burger" aria-label="Menu">☰</button>
</header>
<div id="wrap">
  <nav id="side">
    <input id="filtre" type="search" placeholder="filtrer le menu…" aria-label="Filtrer">
    <!--NAV-->
  </nav>
  <main>
    <div class="inner">
      <!--PANES-->
      <div id="foot">
        <button id="prev">← Précédent</button>
        <button id="next">Suivant →</button>
        <span id="tab"></span>
      </div>
      <p id="legal">Cours de l'École européenne Jacques Delors, remis au propre et augmenté.
      Explications ajoutées et figures&nbsp;: <a rel="license"
      href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr">CC BY-NC-SA 4.0</a> &middot;
      scripts&nbsp;: MIT &middot; source&nbsp;:
      <a href="https://github.com/owulveryck/eelm">github.com/owulveryck/eelm</a></p>
    </div>
  </main>
</div>
<script>
(function(){
  var panes = Array.prototype.slice.call(document.querySelectorAll('.pane'));
  var ids   = panes.map(function(p){return p.id;});
  var links = Array.prototype.slice.call(document.querySelectorAll('#side a'));
  var side  = document.getElementById('side');
  var tab   = document.getElementById('tab');
  var N     = <!--NPAGES-->;
  var cur   = 0;

  function show(id, push){
    var i = ids.indexOf(id);
    if(i < 0){ i = 0; id = ids[0]; }
    cur = i;
    panes.forEach(function(p, k){ p.classList.toggle('active', k === i); });
    links.forEach(function(a){ a.classList.toggle('on', a.dataset.id === id); });
    var on = links.filter(function(a){return a.dataset.id === id;})[0];
    if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
    tab.textContent = (i + 1) + ' / ' + N;
    if(push && location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
    window.scrollTo(0, 0);
    side.classList.remove('open');
  }
  window.addEventListener('hashchange', function(){ show(location.hash.slice(1), false); });
  document.getElementById('prev').onclick = function(){ location.hash = ids[(cur - 1 + N) % N]; };
  document.getElementById('next').onclick = function(){ location.hash = ids[(cur + 1) % N]; };
  document.addEventListener('keydown', function(e){
    if(e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowLeft')  location.hash = ids[(cur - 1 + N) % N];
    if(e.key === 'ArrowRight') location.hash = ids[(cur + 1) % N];
  });
  document.getElementById('burger').onclick = function(){ side.classList.toggle('open'); };
  document.getElementById('filtre').oninput = function(){
    var q = this.value.toLowerCase().trim();
    links.forEach(function(a){
      a.parentNode.style.display = (!q || a.textContent.toLowerCase().indexOf(q) >= 0) ? '' : 'none';
    });
    document.querySelectorAll('.navgroup').forEach(function(g){
      var vis = Array.prototype.slice.call(g.querySelectorAll('li')).some(function(li){
        return li.style.display !== 'none';
      });
      g.style.display = vis ? '' : 'none';
    });
  };
  show(location.hash.slice(1) || ids[0], true);
})();
</script>
</body>
</html>
